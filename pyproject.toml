[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "apiframework"
version = "0.0.1"
description = "Reliable data extraction from HTTP APIs: retries, pagination, rate limits and durable quotas."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nilesh Mevada" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nileshmevadagit/API_framework"
Issues = "https://github.com/nileshmevadagit/API_framework/issues"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
socks = ["httpx[socks]>=0.27"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.25"]
dlt = ["dlt>=1.0"]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apiframework"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls
    "PT",            # pytest style
    "TC",            # type-checking imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration and not costs_money'"
markers = [
    "integration: hits real public APIs or docker-compose services (run nightly)",
    "costs_money: touches paid cloud resources (never in default CI)",
]

[tool.coverage.run]
source = ["apiframework"]
branch = true
